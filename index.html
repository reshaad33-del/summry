<style>
:root{--bg:#eef2f7;--card:#fff;--soft:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#0284c7;--acfg:#fff;--g:#059669;--y:#d97706;--r:#dc2626;--pu:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--soft:#0f1a2c;--tx:#f1f5f9;--mut:#94a3b8;--bd:#273449;--ac:#38bdf8;--acfg:#082f49;--g:#34d399;--y:#fbbf24;--r:#f87171;--pu:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162033;--soft:#0f1a2c;--tx:#f1f5f9;--mut:#94a3b8;--bd:#273449;--ac:#38bdf8;--acfg:#082f49;--g:#34d399;--y:#fbbf24;--r:#f87171;--pu:#a78bfa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;line-height:1.65}
.wrap{max-width:1180px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(19px,4vw,28px);margin:0;font-weight:900}h3{margin:0 0 8px;font-size:15px}
.sub{color:var(--mut);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;font-size:13px;white-space:nowrap;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--ac)}.btn.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}.btn.ok{background:var(--g);color:#fff;border-color:var(--g)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;animation:up .6s both}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cv{position:relative;height:250px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kc{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--bd);border-radius:16px;padding:12px;animation:up .6s both;animation-delay:calc(var(--i)*40ms);transition:.2s}
.kc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
.kc.g{border-top-color:var(--g)}.kc.y{border-top-color:var(--y)}.kc.r{border-top-color:var(--r)}
.val{font-size:26px;font-weight:900;line-height:1.2}.g .val,.tg{color:var(--g)}.y .val,.ty{color:var(--y)}.r .val,.tr{color:var(--r)}
.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.g .bar i,.bar i.g{background:var(--g)}.y .bar i,.bar i.y{background:var(--y)}.r .bar i,.bar i.r{background:var(--r)}
.tip{font-size:12px;background:var(--soft);border-radius:10px;padding:5px 8px;margin-top:6px}
.rings{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}
.ring{position:relative;width:150px;height:150px;text-align:center}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--soft)}.ring .fg{stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:900}
.ring small{font-size:11px;color:var(--mut);font-weight:600}
.fn{display:flex;flex-direction:column;align-items:center;gap:6px}
.fn div{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1);white-space:nowrap;overflow:hidden}
.plan{display:flex;flex-wrap:wrap;gap:8px}
.tile{flex:var(--w) 1 150px;min-height:92px;border-radius:14px;padding:10px;color:#fff;animation:pop .6s both;animation-delay:calc(var(--i)*90ms)}
.tile.g{background:var(--g)}.tile.y{background:var(--y)}.tile.r{background:var(--r)}.tile small{opacity:.9}
.ins{border-radius:12px;padding:8px 12px;margin:6px 0;border:1px solid var(--bd);font-size:13px}.ins.r{border-color:var(--r)}.ins.y{border-color:var(--y)}.ins.g{border-color:var(--g)}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px}
input,select,textarea{width:100%;background:var(--soft);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:64px}
label{font-size:12px;font-weight:700;display:block}.fg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sig{margin:18px 0 6px;text-align:center;padding:18px 12px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--card),var(--soft))}
.sig small{display:block;color:var(--mut);letter-spacing:.25em;font-size:11px}
.sig b{display:block;font-family:Georgia,serif;font-size:clamp(20px,5.5vw,34px);letter-spacing:.18em;background:linear-gradient(90deg,#b8860b,#f5d76e,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.stage{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:10px}
.stage h2{margin:0;font-size:clamp(20px,4vw,30px);animation:up .6s both}.cap{max-width:640px;font-size:16px;animation:up .9s both}
.vis{width:100%;max-width:640px;animation:pop .7s both}.vis .btn{cursor:default}
.tl{display:flex;gap:4px;margin-bottom:8px}.tl i{flex:1;height:7px;border-radius:9px;background:var(--soft);cursor:pointer;transition:.4s}.tl i.on{background:var(--ac)}.tl i.done{background:var(--g)}
.lb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.lb span{width:90px;text-align:right}.lb .bar{flex:1;margin:0}
.tb{text-align:center;font-weight:700;font-size:13px;padding:6px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,#b8860b,#f5d76e,#b8860b);color:#1c1917}
body{-webkit-user-select:none;user-select:none}
@media print{body>*{display:none!important}body::before{content:'نسخة تجريبية - الطباعة غير متاحة';display:block;padding:40px;font-size:24px}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.noprint{display:none!important}}
